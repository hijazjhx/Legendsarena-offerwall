<!DOCTYPE html>
<html>
<head>
  <title>Enter Username | Legends Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f0f0;">

  <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center;">
    <h2>Welcome to Legends Arena</h2>
    <p>Enter your username to start earning coins</p>
    <input type="text" id="username" placeholder="Enter your username" style="padding: 10px; width: 100%; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc;" />
    <button onclick="startOfferwall()" style="padding: 10px 20px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px;">Start</button>
  </div>

  <script>
    function startOfferwall() {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("Please enter a username");
        return;
      }

      // Redirect user to offerwall site with user_id
      const offerwallUrl = `https://legendsarena.github.io/?user_id=${encodeURIComponent(username)}`;
      window.location.href = offerwallUrl;
    }
  </script>
</body>
</html>
